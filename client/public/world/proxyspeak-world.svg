<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100">
<defs>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#202623"/><stop offset="1" stop-color="#101412"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<rect width="1800" height="1100" fill="#080a0a"/>
