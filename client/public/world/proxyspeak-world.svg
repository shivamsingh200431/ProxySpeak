<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
<defs>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202522"/><stop offset="1" stop-color="#111514"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <filter id="shadow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="900" height="520" fill="#090b0b"/>
<rect x="18" y="18" width="864" height="484" rx="26" fill="#050606" stroke="#2f3836" stroke-width="3"/>
<rect x="32" y="32" width="836" height="456" rx="20" fill="url(#floor)"/>
<rect x="32" y="32" width="836" height="456" rx="20" fill="url(#grid)"/>
